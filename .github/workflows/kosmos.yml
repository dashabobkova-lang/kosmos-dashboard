name: kosmos-daily

on:
  schedule:
    - cron: "0 6 * * *"
    - cron: "0 7 * * *"
    - cron: "0 8 * * *"
    - cron: "0 10 * * *"
    - cron: "0 13 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: kosmos-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install --quiet gspread google-auth openpyxl

      - name: write key
        env:
          GSHEET_KEY_JSON: ${{ secrets.GSHEET_KEY_JSON }}
        run: printf '%s' "$GSHEET_KEY_JSON" > cloud/service_account.json

      - name: build and notify
        working-directory: cloud
        env:
          GSHEET_KEY_PATH: service_account.json
          KOSMOS_WORK: work
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python kosmos_daily.py

      - name: receipt
        if: always()
        run: |
          rm -f cloud/service_account.json
          date -u +"%Y-%m-%dT%H:%M:%SZ" > cloud/last_run.txt
          echo "status=${{ job.status }}" >> cloud/last_run.txt
          tail -n 15 cloud/kosmos_daily.log >> cloud/last_run.txt 2>/dev/null || true
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f cloud/last_run.txt cloud/kosmos_state.json 2>/dev/null || true
          git commit -m "run receipt" || true
          git pull --rebase --autostash -q || true
          git push -q || true
