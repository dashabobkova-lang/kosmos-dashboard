name: KOSMOS watchdog

on:
  schedule:
    - cron: "30 8 * * *"   # 11:30 МСК — проверка, что утренний прогон вообще состоялся
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Проверка утреннего прогона
        env:
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT: ${{ secrets.TG_CHAT }}
        run: python watchdog.py
